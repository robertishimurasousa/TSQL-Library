name: Validate library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install -r requirements-dev.txt
      - name: Check SQL syntax, catalog and publication rules
        run: python tools/validate.py
      - name: Test the validation rules
        run: python -m unittest discover -s tests -v
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan prepared files
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" dir . --redact=100 --ignore-gitleaks-allow --no-banner'
      - name: Scan all reachable history
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="--all" --redact=100 --ignore-gitleaks-allow --no-banner'
